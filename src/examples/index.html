<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test</title>
    <style>
        button {
            position: relative;
        }
        img {
            vertical-align: bottom;
        }

        dt-num-list {
            width: 200px;
            height: 120px;
            border: 1px solid #ccc;
            margin-top: 20px;
            float: right;
            scroll-behavior: smooth;
        }

        dt-popover {
            position: fixed;
            top: 50%;
            left: 50%;
        }
        dt-popover [slot="pop"] {
            position: absolute;
            left: 50%;
            transform: translate(-50%);
            color: red;
            width: 100px;
            height: 50px;
            background: #eee;
            border: 1px solid #ccc;
        }

        dt-hhmmss-ms-list-group, dt-yyyymmdd-list-group {
            height: 200px;
            width: 300px;
            margin-bottom: 10px;
            box-shadow: 0 0 5px #ccc;
        }
        dt-hhmmss-ms-list-group::part(list), dt-yyyymmdd-list-group::part(list) {
            scroll-behavior: smooth;
        }

    </style>
</head>

<body>
    <button id="select" class="select">选择日期</button>
    <button id="select-def" class="select">默认选中</button>
    <!-- <img id="img" src="http://dummyimage.com/200x24/4A7BF7&text=ImgBtn" alt=""> -->
    <div id="root"></div>
    <dt-calendar-base
        lang="zh-CN"
        showing-time="2023-03-25T00:00:00.000Z"
        time-start="2023-03-10T00:00:00.000Z" time-end="2023-03-20T00:00:00.000Z"
        min-time="2023-03-02T00:00:00.000Z"   max-time="2023-03-19T00:00:00.000Z"
    ></dt-calendar-base>
    <dt-num-list current-num="20"></dt-num-list>

    <dt-popover open>
        <button slot="trigger" id="btn" class="select">popover</button>
        <div slot="pop">
            asdf
        </div>
    </dt-popover>

    <!-- 2:38:12.089 ((((2*60)+38)*60+12)*1000)+89 -->
    <dt-hhmmss-ms-list-group
        millisecond="9492089"
        col-order="hms"
    ></dt-hhmmss-ms-list-group>

    <dt-yyyymmdd-list-group
        millisecond="1756304532472"
        col-order="yms"
    ></dt-yyyymmdd-list-group>

    <script type="module" src="./index.ts"></script>
</body>

</html>
