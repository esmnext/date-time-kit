<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test</title>
    <style>
        button {
            position: relative;
        }
        img {
            vertical-align: bottom;
        }

        dt-num-list {
            width: 200px;
            height: 120px;
            border: 1px solid #ccc;
            margin-top: 20px;
            float: right;
            scroll-behavior: smooth;
        }

        dt-popover {
            position: fixed;
            top: 50%;
            left: 50%;
        }
        dt-popover [slot="pop"] {
            position: absolute;
            left: 50%;
            transform: translate(-50%);
            color: red;
            width: 100px;
            height: 50px;
            background: #eee;
            border: 1px solid #ccc;
        }

        dt-hhmmss-ms-list-grp, dt-yyyymmdd-list-grp {
            height: 200px;
            width: 300px;
            margin-bottom: 10px;
            box-shadow: 0 0 5px #ccc;
        }
        dt-hhmmss-ms-list-grp::part(list), dt-yyyymmdd-list-grp::part(list) {
            scroll-behavior: smooth;
        }

    </style>
</head>

    <button id="select" class="select">选择日期</button>
